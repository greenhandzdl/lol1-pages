<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>迷路了 · lol1.moe</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff8f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1420" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('lol1:theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add('js');
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <main class="error-page">
    <span class="ghost-flower" aria-hidden="true">✿</span>
    <div class="error-page__inner">
      <p class="code" aria-hidden="true">404</p>
      <h1>这位小小居民，好像迷路了</h1>
      <p>你要找的页面被风吹走啦。<br>不如先回图鉴，看看 12 位小小居民在做什么？</p>
      <div class="actions">
        <a class="btn btn--primary" href="/">回到首页</a>
        <a class="btn btn--ghost" href="/#gallery">翻开图鉴</a>
      </div>
    </div>
  </main>
</body>
</html>
