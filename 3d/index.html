<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3D 手办台 · 萝莉图鉴 | lol1.moe</title>
  <meta name="description" content="把 12 位小小居民捧在手里转一转：拖拽旋转、双指缩放，还有一局「寻星」小游戏。">
  <meta name="theme-color" content="#fff8f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1420" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://lol1.moe/3d/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="lol1.moe · 萝莉图鉴" href="/feed.xml">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/stage.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "3D 手办台 · 萝莉图鉴",
    "description": "把 12 位小小居民捧在手里转一转：拖拽旋转、双指缩放，还有一局「寻星」小游戏。",
    "url": "https://lol1.moe/3d/",
    "isPartOf": {
      "@type": "WebSite",
      "name": "lol1.moe · 萝莉图鉴",
      "url": "https://lol1.moe/"
    }
  }
  </script>
  <script>
    (function () {
      try {
        document.documentElement.classList.add('js');
        var q = new URLSearchParams(location.search).get('theme');
        var s = localStorage.getItem('lol1:theme');
        var dark = q ? q === 'dark' : s ? s === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body class="page-stage">
  <a class="skip" href="#stage-main">跳到 3D 舞台</a>

  <header class="site-header" id="nav">
    <div class="wrap nav">
      <a class="logo" href="/" aria-label="lol1.moe 首页">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M16 5c2 3 2 6 0 8-2-2-2-5 0-8Z" fill="#ff8ab5" stroke="none"/>
            <path d="M27 16c-3 2-6 2-8 0 2-2 5-2 8 0Z" fill="#ffb7d5" stroke="none"/>
            <path d="M16 27c-2-3-2-6 0-8 2 2 2 5 0 8Z" fill="#b79cff" stroke="none"/>
            <path d="M5 16c3-2 6-2 8 0-2 2-5 2-8 0Z" fill="#9fe3cf" stroke="none"/>
          </g>
          <circle cx="16" cy="16" r="3.2" fill="#ffd166"/>
        </svg>
        <span class="logo__word">lol1<i>.moe</i></span>
        <span class="logo__badge">萝莉图鉴</span>
      </a>

      <nav class="nav__links" aria-label="主导航">
        <a class="nav__link" href="/">图鉴</a>
        <a class="nav__link" href="/3d/" aria-current="page">3D 手办台</a>
        <a class="nav__link" href="/shelf/">收藏册</a>
        <a class="nav__link" href="/play/">小游戏</a>
      </nav>

      <a class="icon-btn" href="https://github.com/greenhandzdl/lol1-pages" target="_blank" rel="noopener" aria-label="GitHub 源码">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.7.08-.7 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.75.4-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.78 0c2.2-1.5 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.8 1.19 1.82 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.41.35.78 1.05.78 2.12v3.14c0 .31.2.67.8.56A11.5 11.5 0 0 0 23.5 12A11.5 11.5 0 0 0 12 .5Z"/></svg>
      </a>
      <button class="icon-btn theme-toggle" id="theme-btn" type="button" aria-label="切换明暗主题" aria-pressed="false">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7Z"/></svg>
      </button>
    </div>
  </header>

  <main id="stage-main" class="stage" data-state="loading">
    <div class="stage__viewport" id="viewport" aria-label="3D 角色展示区">
      <noscript>
        <!-- 这个 <img> 原来没有 src —— 关掉 JS 的用户看到一个 80×26 的
             破图框，里面对着「樱井小春」四个字。补上插画本身，
             并说清楚这里本来应该是什么。 -->
        <img class="stage__fallback" src="/assets/img/works/sakura-600.webp"
             alt="樱井小春的插画（3D 手办需要开启 JavaScript 才能转动）"
             width="600" height="800" loading="lazy" decoding="async">
        <p class="stage__nojs">
          3D 手办台需要 JavaScript 才能转动。上面是她的插画；
          想看完整档案可以去 <a href="/c/sakura/">樱井小春的页面</a>。
        </p>
      </noscript>
      <p class="stage__hint" aria-hidden="true">拖动旋转 · 双指缩放</p>
      <div class="stage__loading" id="loading" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>正在把小居民请上台…</span>
      </div>
      <div class="stage__error" id="stage-error" hidden>
        <p>这台设备暂时放不了 3D，已切换为图片模式。</p>
        <img class="stage__fallback" id="fallback-img" alt="" width="768" height="1024">
      </div>
    </div>

    <aside class="stage__panel" aria-labelledby="stage-name">
      <!-- 内层容器：换人时只让这层淡入，面板的底色/边框/色带都不动 -->
      <div class="stage__panelInner">
        <p class="stage__eyebrow" id="stage-region">—</p>
        <h1 class="stage__name" id="stage-name">—</h1>
        <p class="stage__title" id="stage-title"></p>
        <p class="stage__tagline" id="stage-tagline"></p>
        <dl class="stage__meta">
          <div><dt>元素</dt><dd id="stage-element">—</dd></div>
          <div><dt>地域</dt><dd id="stage-region2">—</dd></div>
          <div><dt>标签</dt><dd id="stage-tags">—</dd></div>
        </dl>
        <p class="stage__credit" id="stage-credit"></p>

        <!-- 官网原来的侧栏只有干巴巴的「元素/地域/标签」三行，看完不知道
             她是谁。档案页里早就写好了喜欢/不喜欢/小习惯，这里一直没露过面。
             切换人物时补上这几行，翻着手办就有新东西可看。 -->
        <!-- 她在说话。台词放在属性之后、喜好之前 ——
             上半截是"她是谁"（属性），下半截是"她什么样"（喜好/习惯），
             台词正好是这两半之间的过渡。 -->
        <div class="stage__voice">
          <p class="stage__voice-text" id="stage-voice" aria-live="polite"></p>
          <button class="stage__voice-next" id="stage-voice-next" type="button"
                  aria-label="换一句台词">换一句 »</button>
        </div>

        <dl class="stage__meta stage__meta--person" id="stage-person">
          <div><dt>喜欢</dt><dd id="stage-likes">—</dd></div>
          <div><dt>不喜欢</dt><dd id="stage-dislikes">—</dd></div>
        </dl>
        <p class="stage__habit" id="stage-habit"></p>

        <div class="stage__strip" id="stage-strip" role="group" aria-label="选择一个角色"></div>

        <div class="stage__actions">
          <button class="btn btn--ghost" id="prev-btn" type="button" aria-label="上一个角色">← 上一个</button>
          <button class="btn btn--primary" id="game-btn" type="button">开始寻星</button>
          <button class="btn btn--ghost" id="next-btn" type="button" aria-label="下一个角色">下一个 →</button>
        </div>
        <p class="stage__keys" aria-hidden="true">← → 切换 · 拖拽旋转 · 滚轮缩放</p>
      </div>
    </aside>

    <section class="game" id="game" hidden aria-labelledby="game-title">
      <h2 class="game__title" id="game-title">寻星</h2>
      <p class="game__rule">45 秒内找到藏在角色身上的 3 颗星。转到背面找找看。</p>
      <p class="game__hud">
        <span>已找到 <b id="found-count">0</b>/3</span>
        <span>剩余 <b id="game-time">45</b>s</span>
      </p>
      <p class="game__msg" id="game-msg" role="status" aria-live="polite"></p>
      <button class="btn btn--ghost" id="game-quit" type="button">退出</button>
    </section>
  </main>

  <!-- 这一页原来没有页脚，是全站唯一的一页 —— 从 3D 台点到别的页面突然多出
       一条底线，再点回来又没了，像少画了一块。 -->
  <footer class="stage__foot">
    <div class="wrap"><p><a href="/">← 回到图鉴</a> · 角色与插画均为 AI 生成 · 全年龄向</p></div>
  </footer>

  <script type="module" src="/assets/js/stage/app.js"></script>
</body>
</html>
